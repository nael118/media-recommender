<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vibe Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12181A;
    --surface: #1B2422;
    --teal: #3E8E86;
    --amber: #D98B3F;
    --text: #EDEAE3;
    --muted: #7C918D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 3rem 1.5rem;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
  }

  main {
    width: 100%;
    max-width: 520px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 2.6rem;
    margin: 0 0 0.25rem 0;
  }

  .subhead {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 2rem 0;
  }

  .title-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.6rem;
  }

  .title-row input {
    flex: 1;
    background: var(--surface);
    border: 1px solid #2A3634;
    border-radius: 4px;
    padding: 0.65rem 0.8rem;
    color: var(--text);
    font-size: 0.95rem;
  }

  .title-row input:focus {
    outline: none;
    border-color: var(--teal);
  }

  .title-row button {
    background: none;
    border: 1px solid #2A3634;
    border-radius: 4px;
    color: var(--muted);
    width: 2.4rem;
    cursor: pointer;
    font-size: 1.1rem;
  }

  .title-row button:hover {
    border-color: var(--muted);
  }

  #add-row {
    background: none;
    border: none;
    color: var(--teal);
    font-size: 0.9rem;
    cursor: pointer;
    padding: 0.3rem 0;
    margin-bottom: 1.5rem;
  }

  #submit {
    width: 100%;
    background: var(--amber);
    border: none;
    border-radius: 4px;
    color: #1A1410;
    font-weight: 600;
    font-size: 1rem;
    padding: 0.85rem;
    cursor: pointer;
  }

    #profile-recommend {
    width: 100%;
    background: none;
    border: 1px solid var(--teal);
    border-radius: 4px;
    color: var(--teal);
    font-size: 0.9rem;
    padding: 0.7rem;
    margin-top: 0.6rem;
    cursor: pointer;
  }

  #submit:disabled {
    opacity: 0.5;
    cursor: default;
  }

  #status {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 0.8rem;
    min-height: 1.2rem;
  }

  #results {
    margin-top: 2.5rem;
    border-top: 1px solid #2A3634;
    padding-top: 1.5rem;
  }

  .result-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.55rem 0;
  }

  .result-rank {
    color: var(--muted);
    font-size: 0.85rem;
    width: 1.3rem;
  }

  .result-title {
    flex: 1;
    font-size: 0.98rem;
  }

  .result-bar-track {
    width: 60px;
    height: 4px;
    background: #2A3634;
    border-radius: 2px;
    overflow: hidden;
  }

  .result-bar-fill {
    height: 100%;
    background: var(--amber);
  }

  .result-score {
    color: var(--muted);
    font-size: 0.82rem;
    width: 2.4rem;
    text-align: right;
  }

  .title-row select {
    background: var(--surface);
    border: 1px solid #2A3634;
    border-radius: 4px;
    color: var(--text);
    padding: 0 0.5rem;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<main>
  <h1>Vibe Match</h1>
  <p class="subhead">Tell it what you like. It finds the through-line.</p>

    <div id="title-rows">
    <div class="title-row">
      <input type="text" placeholder="A piece of media you like" />
      <select class="media-type">
        <option value="movie">Movie</option>
        <option value="book">Book</option>
      </select>
      <button type="button" class="remove-row">×</button>
    </div>
  </div>

  <button id="add-row" type="button">+ add media</button>

  <button id="submit" type="button">Find recommendations</button>
  <button id="profile-recommend" type="button">Recommend from my profile</button>
  <div id="status"></div>

  <div id="results"></div>
</main>

<script>
const titleRows = document.getElementById('title-rows');
const addRowBtn = document.getElementById('add-row');
const submitBtn = document.getElementById('submit');
const profileRecommendBtn = document.getElementById('profile-recommend');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');

function makeRow() {
  const row = document.createElement('div');
  row.className = 'title-row';
  row.innerHTML = `
    <input type="text" placeholder="A movie or book you like" />
    <select class="media-type">
      <option value="movie">Movie</option>
      <option value="book">Book</option>
    </select>
    <button type="button" class="remove-row">×</button>
  `;
  row.querySelector('.remove-row').addEventListener('click', () => row.remove());
  return row;
}

function renderResults(recommendations) {
  resultsEl.innerHTML = '';
  const maxScore = Math.max(...recommendations.map(r => r.score));

  recommendations.forEach((rec, index) => {
    const row = document.createElement('div');
    row.className = 'result-row';
    const barWidth = (rec.score / maxScore) * 100;
    const mediaLabel = rec.media_type === 'book' ? '📖' : '🎬';
    row.innerHTML = `
      <span class="result-rank">${index + 1}</span>
      <span class="result-title">${mediaLabel} ${rec.title}</span>
      <span class="result-bar-track"><span class="result-bar-fill" style="width: ${barWidth}%"></span></span>
      <span class="result-score">${rec.score.toFixed(2)}</span>
      <button class="like-btn" data-title="${rec.title}" data-media-type="${rec.media_type}">❤️</button>
    `;
    resultsEl.appendChild(row);
  });

  document.querySelectorAll('.like-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = '...';

      try {
        await fetch('/like', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: btn.dataset.title,
            media_type: btn.dataset.mediaType,
            title: btn.dataset.title
          })
        });
        btn.textContent = '✓';
      } catch (err) {
        btn.textContent = '❤️';
        btn.disabled = false;
      }
    });
  });
}

addRowBtn.addEventListener('click', () => {
  titleRows.appendChild(makeRow());
});

titleRows.querySelector('.remove-row').addEventListener('click', (e) => {
  e.target.closest('.title-row').remove();
});

submitBtn.addEventListener('click', async () => {
  const titles = Array.from(titleRows.querySelectorAll('.title-row'))
    .map(row => ({
      title: row.querySelector('input').value.trim(),
      media_type: row.querySelector('.media-type').value
    }))
    .filter(entry => entry.title.length > 0);

  if (titles.length === 0) {
    statusEl.textContent = 'Enter at least one movie or book.';
    return;
  }

  submitBtn.disabled = true;
  statusEl.textContent = 'Finding recommendations...';
  resultsEl.innerHTML = '';

  try {
    const response = await fetch('/recommend', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ titles: titles, top_n: 10 })
    });

    const data = await response.json();

    if (!response.ok) {
      statusEl.textContent = data.error || 'Something went wrong.';
      return;
    }

    statusEl.textContent = '';
    renderResults(data.recommendations);
  } catch (err) {
    statusEl.textContent = 'Could not reach the server.';
  } finally {
    submitBtn.disabled = false;
  }
});

profileRecommendBtn.addEventListener('click', async () => {
  statusEl.textContent = 'Loading your recommendations...';
  resultsEl.innerHTML = '';

  try {
    const response = await fetch('/recommend/profile');
    const data = await response.json();

    if (!response.ok) {
      statusEl.textContent = data.error || 'Something went wrong.';
      return;
    }

    statusEl.textContent = '';
    renderResults(data.recommendations);
  } catch (err) {
    statusEl.textContent = 'Could not reach the server.';
  }
});
</script>
</body>
</html>
